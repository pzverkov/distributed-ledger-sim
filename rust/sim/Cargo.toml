[package]
name = "time-ledger-sim-rust"
version = "0.4.3"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
deadpool-postgres = "0.14"
time = { version = "0.3.47", features = ["serde", "formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
async-nats = "0.50"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
prometheus = "0.14.0"
sha2 = "0.11"
hex = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["timeout", "trace"] }
futures = "0.3"
async-trait = "0.1"
rdkafka = { version = "0.39", features = ["tokio"], optional = true }

[features]
default = []
redpanda = ["dep:rdkafka"]

[dev-dependencies]
http-body-util = "0.1"
criterion = "0.8"

[[bench]]
name = "messaging"
harness = false
